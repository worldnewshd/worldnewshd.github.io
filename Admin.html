<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD NEWS HD - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f1f3f6;
  color:#222;
}

/* =========================
   HEADER / LOGO
========================= */

header{
  background:linear-gradient(135deg,#080808,#191919,#850000,#d00000);
  color:white;
  padding:20px 15px;
  box-shadow:0 4px 15px #999;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo-box{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#e00000,#790000);
  border:3px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:0 0 12px #ff4444;
}

.logo-text{
  font-size:29px;
  font-weight:900;
  letter-spacing:1px;
}

.logo-text span{
  color:#ffd000;
}

.logo-sub{
  font-size:13px;
  margin-top:4px;
  color:#eee;
}

.admin-title{
  background:#fff;
  color:#b00000;
  padding:10px 14px;
  border-radius:7px;
  font-weight:bold;
}

/* =========================
   LOGIN
========================= */

.login-container{
  max-width:430px;
  margin:60px auto;
  padding:20px;
}

.login-box{
  background:#fff;
  padding:30px;
  border-radius:14px;
  box-shadow:0 4px 20px #bbb;
}

.login-logo{
  text-align:center;
  margin-bottom:25px;
}

.login-logo .big{
  font-size:30px;
  font-weight:900;
}

.login-logo .big span{
  color:#c00000;
}

.login-logo p{
  margin:5px 0;
  color:#777;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
  font-family:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  outline:none;
  border-color:#c00000;
  box-shadow:0 0 4px #e88;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.login-btn{
  width:100%;
  margin-top:20px;
  padding:13px;
  background:#c00000;
  color:#fff;
  border-radius:7px;
  font-size:17px;
  font-weight:bold;
}

.login-btn:hover{
  background:#950000;
}

.message{
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}

/* =========================
   ADMIN PANEL
========================= */

#adminPanel{
  display:none;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.top-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.action-btn{
  padding:11px 16px;
  border-radius:7px;
  color:#fff;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}

.website-btn{
  background:#222;
}

.logout-btn{
  background:#777;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 3px 12px #ccc;
}

.card-title{
  font-size:23px;
  font-weight:bold;
  color:#b00000;
  border-bottom:2px solid #eee;
  padding-bottom:12px;
  margin-bottom:18px;
}

/* =========================
   BREAKING NEWS
========================= */

.breaking-card{
  border-top:5px solid #d00000;
}

.breaking-preview{
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  min-height:48px;
  margin:15px 0;
  border-radius:6px;
  overflow:hidden;
}

.breaking-label{
  background:#d00000;
  padding:14px 15px;
  font-weight:bold;
  white-space:nowrap;
}

.breaking-current{
  padding:12px 15px;
  flex:1;
  font-size:16px;
}

.main-save{
  width:100%;
  padding:14px;
  background:#d00000;
  color:#fff;
  border-radius:7px;
  font-size:18px;
  font-weight:bold;
  margin-top:12px;
}

.main-save:hover{
  background:#a00000;
}

.stop-btn{
  width:100%;
  padding:13px;
  background:#222;
  color:#fff;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

/* =========================
   LIVE
========================= */

.live-card{
  border-top:5px solid #111;
}

.live-save{
  width:100%;
  padding:13px;
  background:#111;
  color:#fff;
  border-radius:7px;
  font-size:17px;
  font-weight:bold;
  margin-top:12px;
}

.live-stop{
  width:100%;
  padding:13px;
  background:#d00000;
  color:#fff;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

/* =========================
   NEWS
========================= */

.news-save{
  width:100%;
  padding:14px;
  background:#c00000;
  color:#fff;
  border-radius:7px;
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
}

.news-list{
  margin-top:20px;
}

.news-item{
  background:#f8f8f8;
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  margin-bottom:10px;
}

.news-item-title{
  font-size:18px;
  font-weight:bold;
  color:#a00000;
}

.news-item-info{
  color:#666;
  font-size:13px;
  margin-top:5px;
}

.delete-btn{
  background:#b00000;
  color:#fff;
  padding:8px 12px;
  border-radius:5px;
  margin-top:10px;
}

/* =========================
   STATUS
========================= */

.status{
  padding:12px;
  border-radius:7px;
  margin-top:12px;
  display:none;
  font-weight:bold;
}

.success{
  background:#dff6e4;
  color:#16752b;
}

.error{
  background:#ffe1e1;
  color:#a00000;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  header{
    padding:14px 10px;
  }

  .header-inner{
    align-items:flex-start;
  }

  .logo-icon{
    width:48px;
    height:48px;
    font-size:22px;
  }

  .logo-text{
    font-size:22px;
  }

  .logo-sub{
    font-size:11px;
  }

  .admin-title{
    font-size:11px;
    padding:8px;
  }

  .container{
    padding:0 10px;
  }

  .card{
    padding:16px;
  }

  .card-title{
    font-size:20px;
  }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>
  <div class="header-inner">

    <div class="logo-box">

      <div class="logo-icon">🌐</div>

      <div>
        <div class="logo-text">
          WORLD <span>NEWS HD</span>
        </div>

        <div class="logo-sub">
          دنیا بھر کی خبریں سب سے پہلے
        </div>
      </div>

    </div>

    <div class="admin-title">
      🔐 ADMIN PANEL
    </div>

  </div>
</header>


<!-- =========================
     LOGIN
========================= -->

<div id="loginContainer" class="login-container">

  <div class="login-box">

    <div class="login-logo">
      <div class="big">
        WORLD <span>NEWS HD</span>
      </div>
      <p>Admin Login</p>
    </div>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="login-btn" onclick="login()">
      🔐 Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">

  <div class="container">

    <div class="top-actions">

      <a
        href="index.html"
        target="_blank"
        class="action-btn website-btn"
      >
        🌐 Website دیکھیں
      </a>

      <button
        onclick="logout()"
        class="action-btn logout-btn"
      >
        🚪 Logout
      </button>

    </div>


    <!-- =====================
         BREAKING NEWS
    ====================== -->

    <div class="card breaking-card">

      <div class="card-title">
        🔴 بریکنگ نیوز
      </div>

      <label>
        بریکنگ نیوز یہاں لکھیں
      </label>

      <textarea
        id="breakingTextInput"
        placeholder="مثلاً: کراچی میں اہم پیش رفت، مزید تفصیلات جلد..."
      ></textarea>

      <div class="breaking-preview">

        <div class="breaking-label">
          🔴 بریکنگ نیوز
        </div>

        <div
          id="breakingCurrent"
          class="breaking-current"
        >
          موجودہ خبر لوڈ ہو رہی ہے...
        </div>

      </div>

      <button
        class="main-save"
        onclick="saveBreaking()"
      >
        💾 بریکنگ نیوز محفوظ کریں اور چلائیں
      </button>

      <button
        class="stop-btn"
        onclick="stopBreaking()"
      >
        ⛔ بریکنگ نیوز بند کریں
      </button>

      <div
        id="breakingStatus"
        class="status"
      ></div>

    </div>


    <!-- =====================
         LIVE NEWS
    ====================== -->

    <div class="card live-card">

      <div class="card-title">
        📺 WORLD NEWS HD LIVE
      </div>

      <label>
        Live کی سرخی
      </label>

      <input
        type="text"
        id="liveTitle"
        placeholder="WORLD NEWS HD LIVE"
      >

      <label>
        YouTube Live Link
      </label>

      <input
        type="text"
        id="liveVideo"
        placeholder="https://www.youtube.com/watch?v=..."
      >

      <button
        class="live-save"
        onclick="saveLive()"
      >
        🔴 LIVE شروع کریں
      </button>

      <button
        class="live-stop"
        onclick="stopLive()"
      >
        ⛔ LIVE بند کریں
      </button>

      <div
        id="liveStatus"
        class="status"
      ></div>

    </div>


    <!-- =====================
         ADD NEWS
    ====================== -->

    <div class="card">

      <div class="card-title">
        📰 نئی خبر شائع کریں
      </div>

      <label>
        خبر کی سرخی
      </label>

      <input
        type="text"
        id="newsTitle"
        placeholder="خبر کی سرخی لکھیں"
      >

      <label>
        خبر کی تفصیل
      </label>

      <textarea
        id="newsBody"
        placeholder="خبر کی مکمل تفصیل لکھیں..."
      ></textarea>

      <label>
        کیٹیگری
      </label>

      <select id="newsCategory">

        <option value="تازہ خبریں">
          تازہ خبریں
        </option>

        <option value="کراچی">
          کراچی
        </option>

        <option value="پاکستان">
          پاکستان
        </option>

        <option value="دنیا">
          دنیا
        </option>

        <option value="کرائم">
          کرائم
        </option>

        <option value="سیاست">
          سیاست
        </option>

        <option value="کھیل">
          کھیل
        </option>

        <option value="کاروبار">
          کاروبار
        </option>

      </select>

      <label>
        تصویر کا URL
      </label>

      <input
        type="text"
        id="newsImage"
        placeholder="https://..."
      >

      <label>
        ویڈیو کا URL
      </label>

      <input
        type="text"
        id="newsVideo"
        placeholder="https://youtube.com/..."
      >

      <button
        class="news-save"
        onclick="addNews()"
      >
        📰 خبر شائع کریں
      </button>

      <div
        id="newsStatus"
        class="status"
      ></div>

    </div>


    <!-- =====================
         PUBLISHED NEWS
    ====================== -->

    <div class="card">

      <div class="card-title">
        📋 شائع شدہ خبریں
      </div>

      <div
        id="newsList"
        class="news-list"
      >
        خبریں لوڈ ہو رہی ہیں...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://mlydxfrsjnnbbaampqan.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4xh2rkJSLqWX2UwC4eHHRA_WpujFv2w";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("loginMessage");

  msg.textContent="Login ہو رہا ہے...";

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    msg.style.color="#b00000";

    msg.textContent =
      "❌ Email یا Password غلط ہے";

    return;
  }

  msg.style.color="green";
  msg.textContent="✅ Login کامیاب";

  showAdmin();

}


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin(){

  document.getElementById("loginContainer")
    .style.display="none";

  document.getElementById("adminPanel")
    .style.display="block";

  loadBreaking();
  loadLive();
  loadNews();

}


/* =========================================
   CHECK LOGIN
========================================= */

async function checkUser(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){

    showAdmin();

  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================================
   BREAKING NEWS LOAD
========================================= */

async function loadBreaking(){

  const {data,error} =
    await supabaseClient
      .from("breaking_news")
      .select("*")
      .eq("id",1)
      .single();

  if(error){

    document.getElementById("breakingCurrent")
      .textContent="ریکارڈ نہیں ملا";

    return;
  }

  document.getElementById("breakingTextInput")
    .value=data.text || "";

  if(data.is_active && data.text){

    document.getElementById("breakingCurrent")
      .textContent=data.text;

  }else{

    document.getElementById("breakingCurrent")
      .textContent="بریکنگ نیوز بند ہے";

  }

}


/* =========================================
   SAVE BREAKING NEWS
========================================= */

async function saveBreaking(){

  const text =
    document
      .getElementById("breakingTextInput")
      .value
      .trim();

  const status =
    document.getElementById("breakingStatus");

  if(!text){

    showStatus(
      status,
      "❌ پہلے بریکنگ نیوز لکھیں",
      false
    );

    return;
  }

  const {error} =
    await supabaseClient
      .from("breaking_news")
      .update({

        text:text,
        is_active:true,
        updated_at:new Date().toISOString()

      })
      .eq("id",1);

  if(error){

    showStatus(
      status,
      "❌ خبر محفوظ نہیں ہوئی: "+error.message,
      false
    );

    return;
  }

  document.getElementById("breakingCurrent")
    .textContent=text;

  showStatus(
    status,
    "✅ بریکنگ نیوز محفوظ ہوگئی اور ویب سائٹ پر چل رہی ہے",
    true
  );

}


/* =========================================
   STOP BREAKING NEWS
========================================= */

async function stopBreaking(){

  const status =
    document.getElementById("breakingStatus");

  const {error} =
    await supabaseClient
      .from("breaking_news")
      .update({

        is_active:false,
        updated_at:new Date().toISOString()

      })
      .eq("id",1);

  if(error){

    showStatus(
      status,
      "❌ بریکنگ نیوز بند نہیں ہوئی",
      false
    );

    return;
  }

  document.getElementById("breakingCurrent")
    .textContent="بریکنگ نیوز بند ہے";

  showStatus(
    status,
    "⛔ بریکنگ نیوز بند ہوگئی",
    true
  );

}


/* =========================================
   LOAD LIVE
========================================= */

async function loadLive(){

  const {data,error} =
    await supabaseClient
      .from("live_status")
      .select("*")
      .eq("id",1)
      .single();

  if(error) return;

  document.getElementById("liveTitle")
    .value=data.title || "";

  document.getElementById("liveVideo")
    .value=data.video_url || "";

}


/* =========================================
   SAVE LIVE
========================================= */

async function saveLive(){

  const title =
    document.getElementById("liveTitle")
      .value.trim();

  const video =
    document.getElementById("liveVideo")
      .value.trim();

  const status =
    document.getElementById("liveStatus");

  if(!video){

    showStatus(
      status,
      "❌ YouTube Live link لکھیں",
      false
    );

    return;
  }

  const {error} =
    await supabaseClient
      .from("live_status")
      .update({

        is_live:true,
        title:title || "WORLD NEWS HD LIVE",
        video_url:video,
        updated_at:new Date().toISOString()

      })
      .eq("id",1);

  if(error){

    showStatus(
      status,
      "❌ Live شروع نہیں ہوا: "+error.message,
      false
    );

    return;
  }

  showStatus(
    status,
    "🔴 LIVE کامیابی سے شروع ہوگیا",
    true
  );

}


/* =========================================
   STOP LIVE
========================================= */

async function stopLive(){

  const status =
    document.getElementById("liveStatus");

  const {error} =
    await supabaseClient
      .from("live_status")
      .update({

        is_live:false,
        updated_at:new Date().toISOString()

      })
      .eq("id",1);

  if(error){

    showStatus(
      status,
      "❌ Live بند نہیں ہوا",
      false
    );

    return;
  }

  showStatus(
    status,
    "⛔ Live بند ہوگیا",
    true
  );

}


/* =========================================
   ADD NEWS
========================================= */

async function addNews(){

  const title =
    document.getElementById("newsTitle")
      .value.trim();

  const body =
    document.getElementById("newsBody")
      .value.trim();

  const category =
    document.getElementById("newsCategory")
      .value;

  const image =
    document.getElementById("newsImage")
      .value.trim();

  const video =
    document.getElementById("newsVideo")
      .value.trim();

  const status =
    document.getElementById("newsStatus");

  if(!title){

    showStatus(
      status,
      "❌ خبر کی سرخی لکھیں",
      false
    );

    return;
  }

  const {error} =
    await supabaseClient
      .from("news")
      .insert({

        title:title,
        body:body,
        category:category,
        image_url:image,
        video_url:video

      });

  if(error){

    showStatus(
      status,
      "❌ خبر شائع نہیں ہوئی: "+error.message,
      false
    );

    return;
  }

  document.getElementById("newsTitle")
    .value="";

  document.getElementById("newsBody")
    .value="";

  document.getElementById("newsImage")
    .value="";

  document.getElementById("newsVideo")
    .value="";

  showStatus(
    status,
    "✅ خبر کامیابی سے شائع ہوگئی",
    true
  );

  loadNews();

}


/* =========================================
   LOAD NEWS
========================================= */

async function loadNews(){

  const list =
    document.getElementById("newsList");

  const {data,error} =
    await supabaseClient
      .from("news")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    list.innerHTML =
      "❌ خبریں لوڈ نہیں ہو سکیں";

    return;
  }

  if(!data || data.length===0){

    list.innerHTML =
      "ابھی کوئی خبر شائع نہیں ہوئی";

    return;
  }

  list.innerHTML="";

  data.forEach(function(item){

    const div =
      document.createElement("div");

    div.className="news-item";

    div.innerHTML=`

      <div class="news-item-title">
        ${escapeHtml(item.title || "")}
      </div>

      <div class="news-item-info">
        ${escapeHtml(item.category || "تازہ خبریں")}
      </div>

      <button
        class="delete-btn"
        onclick="deleteNews('${item.id}')"
      >
        🗑️ خبر حذف کریں
      </button>

    `;

    list.appendChild(div);

  });

}


/* =========================================
   DELETE NEWS
========================================= */

async function deleteNews(id){

  if(!confirm("کیا آپ یہ خبر حذف کرنا چاہتے ہیں؟")){

    return;
  }

  const {error} =
    await supabaseClient
      .from("news")
      .delete()
      .eq("id",id);

  if(error){

    alert(
      "❌ خبر حذف نہیں ہوئی: "+
      error.message
    );

    return;
  }

  loadNews();

}


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(element,text,success){

  element.style.display="block";

  element.className =
    "status "+
    (success ? "success" : "error");

  element.textContent=text;

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
