<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WORLD NEWS HD - دنیا بھر کی خبریں</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f3f3f3;
color:#222;
}

/* HEADER */

header{
background:linear-gradient(135deg,#850000,#d90000);
color:white;
box-shadow:0 3px 12px #777;
}

.header-top{
max-width:1200px;
margin:auto;
padding:18px 15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:34px;
font-weight:900;
white-space:nowrap;
}

.logo span{
color:#ffd400;
}

.tagline{
font-size:14px;
color:#fff;
}

.admin-btn{
background:#fff;
color:#b00000;
padding:10px 15px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

/* NAV */

nav{
background:#222;
overflow-x:auto;
white-space:nowrap;
}

.nav-inner{
max-width:1200px;
margin:auto;
display:flex;
}

nav a{
color:#fff;
text-decoration:none;
padding:13px 18px;
display:block;
font-weight:bold;
}

nav a:hover{
background:#b00000;
}

/* BREAKING NEWS */

.breaking{
display:flex;
background:#111;
color:white;
height:45px;
overflow:hidden;
}

.breaking-label{
background:#d00000;
min-width:135px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:17px;
z-index:2;
}

.breaking-track{
overflow:hidden;
flex:1;
display:flex;
align-items:center;
}

.breaking-text{
white-space:nowrap;
display:inline-block;
padding-right:100%;
animation:scrollNews 18s linear infinite;
font-size:17px;
}

@keyframes scrollNews{

0%{
transform:translateX(0);
}

100%{
transform:translateX(100%);
}

}

/* MAIN */

.container{
max-width:1200px;
margin:20px auto;
padding:0 12px;
}

/* LIVE */

.live-box{
display:none;
background:#111;
color:#fff;
border-radius:10px;
overflow:hidden;
margin-bottom:20px;
box-shadow:0 3px 10px #aaa;
}

.live-head{
background:#c00000;
padding:12px 15px;
font-size:20px;
font-weight:bold;
}

.live-content{
padding:15px;
}

.live-video{
width:100%;
aspect-ratio:16/9;
border:0;
border-radius:7px;
}

.live-title{
font-size:20px;
font-weight:bold;
margin-bottom:12px;
}

/* SECTION */

.section-title{
background:#b00000;
color:#fff;
padding:12px 15px;
font-size:22px;
font-weight:bold;
border-radius:7px;
margin-bottom:15px;
}

/* NEWS GRID */

.news-grid{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:18px;
}

.news-card{
background:#fff;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 9px #ccc;
transition:.2s;
}

.news-card:hover{
transform:translateY(-3px);
}

.news-image{
width:100%;
height:200px;
object-fit:cover;
background:#ddd;
display:block;
}

.no-image{
height:200px;
background:#ddd;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
color:#888;
}

.news-content{
padding:15px;
}

.category{
display:inline-block;
background:#d00000;
color:#fff;
padding:5px 9px;
border-radius:4px;
font-size:12px;
margin-bottom:8px;
}

.news-title{
font-size:21px;
font-weight:bold;
line-height:1.5;
margin:5px 0 10px;
}

.news-body{
font-size:15px;
line-height:1.8;
color:#444;
}

.date{
font-size:12px;
color:#888;
margin-top:10px;
}

.video-btn{
display:inline-block;
margin-top:10px;
background:#c00000;
color:#fff;
padding:8px 12px;
border-radius:5px;
text-decoration:none;
}

/* EMPTY */

.empty{
background:#fff;
padding:30px;
text-align:center;
border-radius:8px;
color:#777;
}

/* FOOTER */

footer{
margin-top:35px;
background:#222;
color:#fff;
text-align:center;
padding:25px 15px;
}

.footer-logo{
font-size:25px;
font-weight:bold;
}

.footer-logo span{
color:#ffd400;
}

/* MOBILE */

@media(max-width:850px){

.news-grid{
grid-template-columns:
repeat(2,1fr);
}

}

@media(max-width:600px){

.header-top{
padding:14px 10px;
}

.logo{
font-size:24px;
}

.tagline{
display:none;
}

.admin-btn{
font-size:12px;
padding:8px 10px;
}

nav a{
padding:11px 13px;
font-size:14px;
}

.breaking-label{
min-width:110px;
font-size:14px;
}

.breaking-text{
font-size:15px;
}

.news-grid{
grid-template-columns:1fr;
}

.news-image,
.no-image{
height:210px;
}

.news-title{
font-size:19px;
}

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="header-top">

<div>

<div class="logo">
WORLD <span>NEWS HD</span>
</div>

<div class="tagline">
دنیا بھر کی خبریں سب سے پہلے
</div>

</div>

<a
href="admin.html"
class="admin-btn">
🔐 Admin
</a>

</div>

</header>


<!-- NAVIGATION -->

<nav>

<div class="nav-inner">

<a href="index.html">
ہوم
</a>

<a href="#latest">
تازہ خبریں
</a>

<a href="#karachi">
کراچی
</a>

<a href="#pakistan">

</a>

<a href="#world">

</a>

<a href="#crime">

</a>

<a href="#politics">

</a>

<a href="#sports">

</a>

<a href="#business">
کاروبار
</a>

</div>

</nav>


<!-- BREAKING NEWS -->

<div
class="breaking"
id="breakingBox"
style="display:none">

<div class="breaking-label">
🔴 بریکنگ نیوز
</div>

<div class="breaking-track">

<div
class="breaking-text"
id="breakingText">
</div>

</div>

</div>


<!-- MAIN -->

<div class="container">


<!-- LIVE -->

<div
class="live-box"
id="liveBox">

<div class="live-head">
🔴 WORLD NEWS HD LIVE
</div>

<div class="live-content">

<div
class="live-title"
id="liveTitle">
WORLD NEWS HD LIVE
</div>

<iframe
id="liveVideo"
class="live-video"
allowfullscreen>
</iframe>

</div>

</div>


<!-- NEWS -->

<div id="latest">

<div class="section-title">
📰 تازہ ترین خبریں
</div>

<div
class="news-grid"
id="newsGrid">

<div class="empty">
خبریں لوڈ ہو رہی ہیں...
</div>

</div>

</div>

</div>


<!-- FOOTER -->

<footer>

<div class="footer-logo">
WORLD <span>NEWS HD</span>
</div>

<p>
دنیا بھر کی خبریں سب سے پہلے
</p>

<p>

</p>

</footer>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://mlydxfrsjnnbbaampqan.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4xh2rkJSLqWX2UwC4eHHRA_WpujFv2w";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
BREAKING NEWS
========================= */

async function loadBreaking(){

const {data,error} =
await supabaseClient
.from("breaking_news")
.select("*")
.eq("id",1)
.single();

if(error || !data){

return;
}

const box =
document.getElementById(
"breakingBox"
);

const text =
document.getElementById(
"breakingText"
);

if(data.is_active &&
data.text){

box.style.display="flex";

text.textContent =
data.text;

}else{

box.style.display="none";

}

}


/* =========================
LIVE
========================= */

async function loadLive(){

const {data,error} =
await supabaseClient
.from("live_status")
.select("*")
.eq("id",1)
.single();

if(error || !data){

return;
}

const box =
document.getElementById(
"liveBox"
);

if(!data.is_live){

box.style.display="none";

return;
}

if(!data.video_url){

box.style.display="none";

return;
}

box.style.display="block";

document.getElementById(
"liveTitle"
).textContent =
data.title ||
"WORLD NEWS HD LIVE";


const video =
convertYoutubeUrl(
data.video_url
);

if(video){

document.getElementById(
"liveVideo"
).src=video;

}

}


/* =========================
NEWS
========================= */

async function loadNews(){

const grid =
document.getElementById(
"newsGrid"
);

const {data,error} =
await supabaseClient
.from("news")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

grid.innerHTML=
'<div class="empty">❌ خبریں لوڈ نہیں ہو سکیں۔</div>';

return;
}

if(!data ||
data.length===0){

grid.innerHTML=
'<div class="empty">ابھی کوئی خبر شائع نہیں ہوئی۔</div>';

return;
}

grid.innerHTML="";


data.forEach(function(item){

const card =
document.createElement("article");

card.className=
"news-card";


let imageHTML="";

if(item.image_url){

imageHTML=`

<img
class="news-image"
src="${escapeHtml(item.image_url)}"
alt="${escapeHtml(item.title)}"
onerror="this.style.display='none'"
>

`;

}else{

imageHTML=`

<div class="no-image">
📰
</div>

`;

}


let videoHTML="";

if(item.video_url){

videoHTML=`

<a
class="video-btn"
href="${escapeHtml(item.video_url)}"
target="_blank"
rel="noopener">

▶ ویڈیو دیکھیں

</a>

`;

}


let date="";

if(item.created_at){

date =
new Date(item.created_at)
.toLocaleString(
"ur-PK"
);

}


card.innerHTML=`

${imageHTML}

<div class="news-content">

<div class="category">
${escapeHtml(
item.category || "تازہ خبریں"
)}
</div>

<div class="news-title">
${escapeHtml(
item.title || ""
)}
</div>

<div class="news-body">
${escapeHtml(
item.body || ""
)}
</div>

${videoHTML}

<div class="date">
🕒 ${escapeHtml(date)}
</div>

</div>

`;

grid.appendChild(card);

});

}


/* =========================
YOUTUBE
========================= */

function convertYoutubeUrl(url){

try{

const u =
new URL(url);

let id="";


if(u.hostname.includes(
"youtube.com"
)){

id=u.searchParams.get("v");

if(!id &&
u.pathname.includes("/live/")
){

id=u.pathname.split("/live/")[1]
.split("/")[0];

}

if(!id &&
u.pathname.includes("/embed/")
){

id=u.pathname.split("/embed/")[1]
.split("/")[0];

}

}


if(u.hostname==="youtu.be"){

id=u.pathname.substring(1);

}


if(!id){

return url;

}

return
"https://www.youtube.com/embed/"
+id
+"?autoplay=1";

}catch(e){

return url;

}

}


/* =========================
SECURITY
========================= */

function escapeHtml(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
START
========================= */

loadBreaking();

loadLive();

loadNews();


/* =========================
AUTO REFRESH
========================= */

setInterval(
function(){

loadBreaking();
loadLive();

},
10000
);

</script>

</body>
