<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD NEWS HD</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Nastaliq Urdu",sans-serif;background:#f5f5f5;color:#171717}
.breaking{background:#c40000;color:#fff;padding:12px;text-align:center;font-size:20px}
header{background:#fff;text-align:center;padding:28px 12px 15px;border-bottom:1px solid #ddd}
.logo{font-size:42px;font-weight:800;direction:ltr}.logo span{color:#b40000}
nav a{display:inline-block;color:#222;text-decoration:none;margin:12px 14px;font-size:20px}
.hero{background:linear-gradient(120deg,#320707,#b00000);color:#fff;text-align:center;padding:70px 20px}
.hero h1{font-size:48px;margin:0 0 20px;direction:ltr}.hero p{font-size:25px;line-height:1.8;margin:0}
.wrap{max-width:1000px;margin:auto;padding:18px}.notice{background:#fff;padding:22px;border-right:7px solid #c40000;font-size:21px;line-height:1.9;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0001}.card img{width:100%;height:190px;object-fit:cover;background:#ddd}.card-body{padding:18px}.tag{color:#b40000;font-weight:bold}.card h2{margin:8px 0;font-size:25px}.card p{font-size:17px;line-height:1.8}
.live{display:none;background:#111;color:#fff;padding:15px;text-align:center;margin:18px 0;border-radius:10px}.live.on{display:block}.live a{color:#fff}
.empty{padding:35px;text-align:center;color:#777}
footer{background:#111;color:#fff;text-align:center;padding:25px;margin-top:30px}
@media(max-width:600px){.logo{font-size:32px}.hero h1{font-size:38px}.hero p{font-size:20px}nav a{font-size:18px;margin:8px}}
</style>
</head>
<body>
<div class="breaking">🔴 WORLD NEWS HD — بریکنگ نیوز</div>
<header>
  <div class="logo"><span>WORLD</span> NEWS HD</div>
  <nav><a href="#">ہوم</a><a href="#news">تازہ خبریں</a><a href="#videos">ویڈیوز</a><a href="#contact">رابطہ</a></nav>
</header>
<section class="hero">
  <h1>WORLD NEWS HD</h1>
  <p>تازہ ترین ملکی، عالمی اور مقامی خبریں — ایک ہی جگہ</p>
</section>
<div class="wrap">
  <div class="notice">⚡ <b>اہم خبر:</b> WORLD NEWS HD پر خوش آمدید — آپ کی خبریں یہاں جلد شائع کی جائیں گی۔</div>
  <div id="liveBox" class="live"><b>🔴 LIVE</b><div id="liveText"></div></div>
  <section id="news"><div id="newsGrid" class="grid"><div class="empty">خبریں لوڈ ہو رہی ہیں...</div></div></section>
</div>
<footer id="contact">WORLD NEWS HD — تازہ اور معتبر خبریں</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mlydxfrsjnnbbaampqan.supabase.co";
const SUPABASE_KEY = "sb_publishable_4xh2rkJSLqWX2UwC4eHHRA_WpujFv2w";
const configured = !SUPABASE_URL.includes("PASTE_") && !SUPABASE_KEY.includes("PASTE_");
let sb = configured ? supabase.createClient(SUPABASE_URL,SUPABASE_KEY) : null;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function card(n){
 const image=n.image_url?`<img src="${esc(n.image_url)}" alt="">`:`<div style="height:190px;background:#ddd;display:grid;place-items:center;font-size:32px;color:#777">خبر</div>`;
 return `<article class="card">${image}<div class="card-body"><div class="tag">${esc(n.category||"تازہ ترین")}</div><h2>${esc(n.title)}</h2><p>${esc(n.body||"")}</p>${n.video_url?`<p><a href="${esc(n.video_url)}" target="_blank" rel="noopener">🎥 ویڈیو دیکھیں</a></p>`:""}</div></article>`;
}
async function load(){
 if(!sb){document.getElementById("newsGrid").innerHTML='<div class="empty">Admin Panel کو Supabase سے connect کرنے کے بعد خبریں یہاں آئیں گی۔</div>';return}
 const {data,error}=await sb.from("news").select("*").eq("published",true).order("created_at",{ascending:false});
 if(error){document.getElementById("newsGrid").innerHTML='<div class="empty">خبریں لوڈ نہیں ہو سکیں۔</div>';return}
 document.getElementById("newsGrid").innerHTML=data?.length?data.map(card).join(""):'<div class="empty">ابھی کوئی خبر شائع نہیں ہوئی۔</div>';
 const {data:lives}=await sb.from("live_status").select("*").eq("id",1).maybeSingle();
 if(lives?.is_live){document.getElementById("liveBox").classList.add("on");document.getElementById("liveText").innerHTML=esc(lives.title||"ہماری لائیو نشریات جاری ہیں")+(lives.video_url?` — <a href="${esc(lives.video_url)}" target="_blank">Live کھولیں</a>`:"");}
}
load();
if(sb){
 sb.channel("public-news").on("postgres_changes",{event:"*",schema:"public",table:"news"},load).subscribe();
 sb.channel("public-live").on("postgres_changes",{event:"*",schema:"public",table:"live_status"},load).subscribe();
}
</script>
</body>
</html>
